name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check format
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.51.0
          test -z "$(goimports -l .)" || { goimports -l .; exit 1; }
      - name: Check lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: Check build
        run: go build ./...
      - name: Run tests
        run: go test -race ./...
      - name: Check Go vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
